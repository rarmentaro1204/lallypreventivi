<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestionale · Lally Decò</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#7d8f6c; --sage-d:#5b6b4e; --sage-l:#e8ede2; --sage-xl:#f4f6f0;
  --bg:#faf8f4; --ink:#2b2f27; --mute:#7a7f73; --line:#e3e1d8; --card:#fff; --warn:#b4543a;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
header.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:8px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
header.top img{height:50px;display:block}
.stepper{display:flex;gap:6px;align-items:center;margin-left:auto;flex-wrap:wrap}
.stp{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px;color:var(--mute);font-family:inherit}
.stp b{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;background:var(--sage-l);color:var(--sage-d)}
.stp.on{border-color:var(--sage);color:var(--sage-d);font-weight:600;background:var(--sage-xl)}
.stp.on b{background:var(--sage);color:#fff}
.stp.done b{background:var(--sage-d);color:#fff}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;max-width:1240px;margin:24px auto;padding:0 24px}
@media(max-width:960px){.layout{grid-template-columns:1fr}}
main{min-width:0}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0}
h2{font-size:30px;color:var(--sage-d)}
.sub{color:var(--mute);margin:2px 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.card h3{font-size:22px;color:var(--sage-d);margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px 16px}
.grid .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute);font-weight:500;letter-spacing:.2px}
input[type=text],input[type=number],input[type=date],select,textarea{font:inherit;color:var(--ink);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--sage-l);border-color:var(--sage)}
textarea{min-height:70px;resize:vertical}
.btn{font:inherit;font-weight:600;padding:9px 16px;border-radius:999px;border:1px solid var(--sage);background:var(--sage);color:#fff;cursor:pointer}
.btn:hover{background:var(--sage-d)}
.btn.ghost{background:#fff;color:var(--sage-d)}
.btn.ghost:hover{background:var(--sage-xl)}
.btn.sm{padding:5px 12px;font-size:12px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:8px;position:sticky;bottom:0;padding:12px 0;background:linear-gradient(to top,var(--bg) 70%,rgba(250,248,244,0));z-index:10}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
/* zone cards */
.irow{display:grid;grid-template-columns:minmax(0,1fr) 118px 104px 96px 30px;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.irow.hd{border-top:0;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.6px;padding-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.chip{font:inherit;font-size:12.5px;padding:5px 12px;border-radius:999px;border:1px solid var(--sage);background:var(--sage-xl);color:var(--sage-d);cursor:pointer}
.chip:hover{background:var(--sage);color:#fff}
.chip.own{background:#fff;border-style:dashed}
.irow input[type=checkbox]{width:18px;height:18px;accent-color:var(--sage)}
.irow .tot{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.irow .x{border:0;background:none;color:var(--warn);cursor:pointer;font-size:18px;line-height:1}
.irow .d{font-size:13.5px}
@media(max-width:700px){
  .irow{grid-template-columns:1fr 1fr 1fr 34px;gap:8px}
  .irow.hd{display:none}
  .irow .dcell{grid-column:1/4}.irow .x{grid-column:4;grid-row:1}
  .irow .tot{text-align:right;align-self:center}
  .stp:not(.on) span{display:none}.stp{padding:6px 9px}
  header.top{padding:8px 14px;gap:10px}header.top img{height:40px}
  .layout{padding:0 14px;margin-top:16px}
  .sheet{padding:20px 16px}.kv{grid-template-columns:100px 1fr}.tots{width:100%}
  table.q{font-size:11.5px}
  #mbar{display:flex}.nav{bottom:50px}body{padding-bottom:56px}
  aside .card{position:static}
}
/* sidebar */
aside .card{position:sticky;top:92px}
.big{font-family:var(--serif);font-size:40px;font-weight:700;color:var(--sage-d);line-height:1.1}
.row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:13px}
.row.mu{color:var(--mute)}
.hr{border-top:1px solid var(--line);margin:10px 0}
input[type=number]{text-align:right;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=text],input[type=number],input[type=date],input[type=tel],select{height:40px}
textarea{padding:10px}
input[type=tel]{font:inherit;color:var(--ink);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%}
button{transition:background .15s,transform .05s,border-color .15s}button:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.eyebrow{font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--sage);font-weight:600;margin-bottom:2px}
.card{box-shadow:0 1px 2px rgba(60,70,50,.04)}
.zone{padding:0}
.zhead{display:flex;align-items:center;gap:10px;width:100%;padding:14px 18px;background:none;border:0;cursor:pointer;font:inherit;text-align:left;color:inherit;border-radius:14px}
.zhead:hover{background:var(--sage-xl)}
.zhead h3{margin:0;font-size:21px;color:var(--sage-d);flex:1}
.zhead .zs{font-weight:600;color:var(--sage-d);white-space:nowrap;font-variant-numeric:tabular-nums}
.zhead .chev{display:inline-block;transition:transform .2s;color:var(--sage);font-size:20px;line-height:1;width:14px}
.zone:not(.closed) .chev{transform:rotate(90deg)}
.badge{background:var(--sage-l);color:var(--sage-d);font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 9px;min-width:22px;text-align:center}
.badge.z{background:#f1efe8;color:var(--mute)}
.zbody{padding:0 18px 16px}
.zone.closed .zbody{display:none}
.dcell{display:flex;flex-direction:column;gap:4px;min-width:0}
.incl{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mute);cursor:pointer}
.irow .incl input{width:15px;height:15px;accent-color:var(--sage)}
.qty{display:grid;grid-template-columns:32px 1fr 32px;height:40px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.qty input{border:0;border-radius:0;height:38px;text-align:center;padding:0;min-width:0}
.qty input:focus{outline:none;background:var(--sage-xl)}
.qty button{border:0;background:var(--sage-xl);color:var(--sage-d);font-size:18px;cursor:pointer;line-height:1}
.qty button:hover{background:var(--sage-l)}
.pcell{position:relative}.pcell span{position:absolute;left:10px;top:10px;color:var(--mute)}
.pcell input{padding-left:24px}
.irow .tot{align-self:center;padding-top:0}
.irow .x{width:30px;height:30px;border-radius:50%;margin-top:5px;font-size:20px;color:var(--mute)}
.irow .x:hover{background:#f7e4de;color:var(--warn)}
.irow.new{animation:pop .45s ease}
@keyframes pop{from{background:var(--sage-l);transform:translateY(-4px);opacity:.4}to{background:transparent;transform:none;opacity:1}}
.chip{display:inline-flex;gap:8px;align-items:center}
.chip .cp{font-size:11px;color:var(--mute);border-left:1px solid var(--line);padding-left:8px}
.chip:hover .cp{color:#fff;border-color:rgba(255,255,255,.4)}
.chips .lbl{width:100%;font-size:11.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.8px}
#toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,30px);background:#2b2f27;color:#fff;padding:10px 16px;border-radius:999px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:.25s;z-index:60;font-size:13px}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:#cfe0bd;font-weight:600;cursor:pointer;font:inherit;font-weight:600}
#mbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:10px 16px;justify-content:space-between;align-items:center;font-size:13px}
#mbar b{font-family:var(--serif);font-size:22px;color:var(--sage-d)}
@media(max-width:700px){#mbar{display:flex}#toast{bottom:122px}}
.warn{background:#fbf1e6;border:1px solid #efd5b3;color:#7a4b12;border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px}
.stepper{position:relative}
/* ── CRM ── */
header.top .mt{font:inherit;border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--mute);font-weight:500;border-bottom:2px solid transparent;display:inline-flex;gap:6px;align-items:center}
header.top .mt:hover{color:var(--sage-d)}
header.top .mt.on{color:var(--sage-d);font-weight:600;border-bottom-color:var(--sage)}
#mainnav{display:flex;gap:2px;margin-left:12px;flex-wrap:wrap}
.hbtns{display:flex;gap:6px;margin-left:auto}
body[data-mode=list] .layout{grid-template-columns:1fr}
body[data-mode=list] aside,body[data-mode=list] #mbar{display:none!important}
.stepper.inpage{margin:0 0 16px;justify-content:flex-start}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.kpi span{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--mute)}
.kpi b{font-family:var(--serif);font-size:26px;color:var(--sage-d)}
.tools .chip.selected{background:var(--sage);color:#fff}
.tblwrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--mute);text-align:left;padding:10px 14px;background:var(--sage-xl);font-weight:600}
.tbl td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:middle}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums}
.tbl th.n{text-align:right}
.tbl small{color:var(--mute)}
.tbl tr.clk{cursor:pointer}.tbl tr.clk:hover{background:var(--sage-xl)}
.tbl tr.past{opacity:.6}
.tbl td.late{color:var(--warn);font-weight:600}.tbl td.ok{color:var(--sage-d);font-weight:600}
.tbl td.empty{text-align:center;color:var(--mute);padding:34px}
.bar{height:5px;background:var(--sage-l);border-radius:3px;margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--sage)}
.bdg{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 11px}
.bdg.preventivo{background:#f3ecd9;color:#7b6420}.bdg.confermato{background:var(--sage);color:#fff}.bdg.perso{background:#eceae4;color:var(--mute)}
.dhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.stab{font:inherit;border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.stab.on{color:var(--sage-d);font-weight:600;border-bottom-color:var(--sage)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.row.gt{border-top:2px solid var(--sage);margin-top:6px;padding-top:8px;font-family:var(--serif);font-size:24px;color:var(--sage-d)}
input.mini{width:64px;height:30px;display:inline-block;padding:2px 6px;margin:0 2px}
.prow input[data-pf=label]{grid-column:1/-1}
.prow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.prow .sub2{grid-column:1/-1;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.prow .x,.crow .x{border:0;background:none;color:var(--mute);cursor:pointer;font-size:20px;width:30px;height:30px;border-radius:50%;margin-left:auto}
.prow .x:hover,.crow .x:hover{background:#f7e4de;color:var(--warn)}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 130px 30px;gap:8px;padding:6px 0;align-items:center}
.sumrow{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);margin-top:8px}
.sumrow b{font-variant-numeric:tabular-nums}
.warn2{color:var(--warn);font-size:12.5px;min-height:0}
.prow .pcell span,.crow .pcell span{top:10px}
@media(max-width:700px){.hbtns{margin-left:0}#mainnav{margin-left:0;width:100%}}
@media print{#mbar,#toast,.dhead,.stabs{display:none!important}}

/* document */
.sheet{background:#fff;border:1px solid var(--line);border-radius:6px;padding:34px 40px;max-width:820px;margin:0 auto;box-shadow:0 2px 14px rgba(60,70,50,.08)}
.sheet .hdr{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:2px solid var(--sage);padding-bottom:12px;margin-bottom:14px}
.sheet .hdr img{height:84px}
.sheet .hdr .co{text-align:right;font-size:12.5px;color:var(--mute)}
.sheet .hdr .co b{display:block;font-family:var(--serif);font-size:20px;color:var(--sage-d)}
.sheet h1{font-size:27px;color:var(--sage-d);margin:6px 0 2px}
.sheet .when{font-family:var(--serif);font-size:19px;margin-bottom:10px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:3px 12px;font-size:13px;margin:10px 0}
.kv span:nth-child(odd){color:var(--mute)}
.theme{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--sage-d);border-left:3px solid var(--sage-l);padding:2px 0 2px 12px;margin:10px 0}
table.q{width:100%;border-collapse:collapse;margin-top:12px;font-size:12.8px}
table.q th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);text-align:right;padding:6px 6px;border-bottom:1px solid var(--line)}
table.q th:first-child{text-align:left}
table.q td{padding:5px 6px;vertical-align:top;border-bottom:1px solid #f0eee7}
table.q td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.q tr.z td{background:var(--sage-xl);color:var(--sage-d);font-weight:600;font-family:var(--serif);font-size:15px;letter-spacing:.3px;border-bottom:0;padding-top:8px}
table.q td.inc{color:var(--mute);font-style:italic}
.tots{margin:14px 0 0 auto;width:320px;font-size:13px}
.tots .row{padding:3px 0}
.tots .gt{border-top:2px solid var(--sage);margin-top:6px;padding-top:8px;font-family:var(--serif);font-size:24px;font-weight:700;color:var(--sage-d)}
.cond{margin-top:22px;font-size:11.8px;color:#4b5046}
.cond p{margin:0 0 5px}
.pay{margin-top:16px;border:1px dashed var(--sage);border-radius:8px;padding:10px 14px;font-size:12.5px}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:34px;font-size:12px;color:var(--mute)}
.sign div{border-top:1px solid var(--ink);padding-top:4px}
.note{font-size:12px;color:var(--mute);margin-top:6px}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  header.top,aside,.nav,.tools,.stepper,.noprint,h2.pg,.sub.pg{display:none!important}
  .layout{display:block;margin:0;padding:0;max-width:none}
  .sheet{border:0;box-shadow:none;padding:0;max-width:none}
  table.q tr{break-inside:avoid}
  .pay,.sign,.tots{break-inside:avoid}
}
</style>
</head>

const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const nfEur=new Intl.NumberFormat('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});
const eur=n=>{n=n||0;return (n<0?'−':'')+nfEur.format(Math.abs(n)).replace(/^(\d)(\d{3}),/,'$1.$2,')+' €'};

const getp=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
const setp=(o,p,v)=>{const ks=p.split('.');const l=ks.pop();ks.reduce((a,k)=>a[k],o)[l]=v};
const lineTot=it=>it.on&&!it.inc?r2((+it.q||0)*(+it.p||0)):0;
const zoneSub=z=>r2(z.items.reduce((s,i)=>s+lineTot(i),0));
function totalsOf(s){
  const sub=r2(s.zones.reduce((a,z)=>a+zoneSub(z),0));
  const sc=r2(sub*(+s.extra.sconto||0)/100);
  const imp=r2(sub-sc);
  const iva=r2(imp*(+s.extra.iva||0)/100);
  const tot=r2(imp+iva);
  const cap=r2(tot*(+s.extra.caparra||0)/100);
  return {sub,sc,imp,iva,tot,cap,saldo:r2(tot-cap)};
}

const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};

/* ───────────── CRM: helper ───────────── */
UI.f='aperti';UI.q='';
const cur=()=>DB.records.find(r=>r.id===openId);
const rid=()=>'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmtShort=iso=>{if(!iso)return'—';const d=new Date(iso+'T12:00:00');return isNaN(d)?'—':d.toLocaleDateString('it-IT')};
const badge=st=>`<span class="bdg ${st}">${{preventivo:'Preventivo',confermato:'Confermato',perso:'Perso'}[st]||st}</span>`;
const clone=o=>JSON.parse(JSON.stringify(o));
function recalcUid(){const ks=[DB.draft,...DB.records.map(r=>r.S)].flatMap(s=>s.zones.flatMap(z=>z.items.map(i=>i.k||0)));uid=Math.max(uid,...ks,0)+1}
function defaultPag(s){
  const T=totalsOf(s),ev=s.meta.dataEvento;
  return [{id:rid(),label:'Caparra confirmatoria '+(s.extra.caparra||0)+'%',importo:T.cap,scad:'',pagato:false,dataPag:'',saldo:false},
          {id:rid(),label:'Saldo',importo:0,scad:ev?addDays(ev,-7):'',pagato:false,dataPag:'',saldo:true}];
}
function newRecord(s){return {id:rid(),stato:'preventivo',creato:todayISO(),S:s,pag:defaultPag(s),costi:[],note:''}}

/* economics di un record: rate, incassi, costi, margine */
function payCalc(rec){
  const T=totalsOf(rec.S);
  const sumFixed=r2(rec.pag.filter(p=>!p.saldo).reduce((s,p)=>s+(+p.importo||0),0));
  const rest=r2(T.tot-sumFixed);
  const amt=rec.pag.map(p=>p.saldo?rest:r2(+p.importo||0));
  const inc=r2(rec.pag.reduce((s,p,i)=>s+(p.pagato?amt[i]:0),0));
  const costi=r2(rec.costi.reduce((s,c)=>s+(+c.importo||0),0));
  const marg=r2(T.imp-costi);
  const sched=r2(amt.reduce((a,b)=>a+b,0));
  return {T,amt,rest,inc,res:r2(T.tot-inc),costi,marg,margP:T.imp?marg/T.imp*100:0,sched,diff:r2(T.tot-sched),hasSaldo:rec.pag.some(p=>p.saldo)};
}
function nextDue(rec,c){
  const open=rec.pag.map((p,i)=>({p,a:c.amt[i]})).filter(x=>!x.p.pagato&&x.a>0);
  if(!open.length)return c.res<=0?{txt:'Saldato ✓',cls:'ok'}:{txt:'—',cls:''};
  open.sort((a,b)=>(a.p.scad||'9999').localeCompare(b.p.scad||'9999'));
  const n=open[0];
  return {txt:`${n.p.scad?fmtShort(n.p.scad):'senza data'} · ${eur(n.a)}`,cls:(n.p.scad&&n.p.scad<todayISO())?'late':''};
}

/* ───────────── LISTA PREVENTIVI ───────────── */
function rowsPrev(){
  const q=(UI.q||'').toLowerCase();
  let list=DB.records.filter(r=>r.stato!=='confermato');
  if(UI.f==='aperti')list=list.filter(r=>r.stato==='preventivo');
  else if(UI.f==='persi')list=list.filter(r=>r.stato==='perso');
  if(q)list=list.filter(r=>[r.S.meta.sposi,r.S.meta.location,r.S.meta.numero].join(' ').toLowerCase().includes(q));
  list.sort((a,b)=>(b.creato||'').localeCompare(a.creato||''));
  if(!list.length)return `<tr><td colspan="6" class="empty">${DB.records.length?'Nessun preventivo con questi filtri.':'Ancora nessun preventivo. Crealo dal <b>Preventivatore</b> e salvalo qui.'}</td></tr>`;
  return list.map(r=>{const T=totalsOf(r.S),m=r.S.meta;
    return `<tr class="clk" data-open="${r.id}"><td><b>${esc(m.sposi||'Senza nome')}</b>${m.numero?`<br><small>n. ${esc(m.numero)}</small>`:''}</td>
    <td>${fmtShort(m.dataEvento)}</td><td>${esc(m.location||'—')}</td><td class="n">${eur(T.tot)}</td><td>${badge(r.stato)}</td><td>${fmtShort(r.creato)}</td></tr>`}).join('');
}
function listPreventivi(){
  const open=DB.records.filter(r=>r.stato==='preventivo');
  const val=r2(open.reduce((s,r)=>s+totalsOf(r.S).tot,0));
  const persi=DB.records.filter(r=>r.stato==='perso').length;
  return `<div class="eyebrow">Gestionale</div><h2>Preventivi</h2><p class="sub">Apri un preventivo per modificare parametri, voci ed economics.</p>

/* ───────────── LISTA EVENTI CONFERMATI ───────────── */
function listEventi(){
  const list=DB.records.filter(r=>r.stato==='confermato');
  list.sort((a,b)=>(a.S.meta.dataEvento||'9999').localeCompare(b.S.meta.dataEvento||'9999'));
  let tot=0,inc=0,marg=0;
  const rows=list.map(r=>{
    const c=payCalc(r),m=r.S.meta,nd=nextDue(r,c),past=m.dataEvento&&m.dataEvento<todayISO();
    tot+=c.T.tot;inc+=c.inc;if(r.costi.length)marg+=c.marg;
    const pct=c.T.tot?Math.min(100,Math.max(0,c.inc/c.T.tot*100)):0;
    const inv=(+m.adulti||0)+(+m.bimbi||0);
    return `<tr class="clk ${past?'past':''}" data-open="${r.id}"><td><b>${esc(m.sposi||'Senza nome')}</b>${past?'<br><small>concluso</small>':''}</td>
      <td>${fmtShort(m.dataEvento)}</td><td>${esc(m.location||'—')}</td><td class="n">${inv||'—'}</td><td class="n">${eur(c.T.tot)}</td>
      <td class="n">${eur(c.inc)}<div class="bar"><i style="width:${pct}%"></i></div></td><td class="n">${eur(c.res)}</td>
      <td class="n">${r.costi.length?eur(c.marg):'—'}</td><td class="${nd.cls}">${nd.txt}</td></tr>`}).join('');
  return `<div class="eyebrow">Gestionale</div><h2>Eventi confermati</h2><p class="sub">Ordinati per data. Apri un evento per aggiornare parametri, incassi e costi.</p>
  <div class="kpis"><div class="kpi"><span>Eventi</span><b>${list.length}</b></div><div class="kpi"><span>Contrattualizzato</span><b>${eur(r2(tot))}</b></div>
   <div class="kpi"><span>Incassato</span><b>${eur(r2(inc))}</b></div><div class="kpi"><span>Da incassare</span><b>${eur(r2(tot-inc))}</b></div>
   <div class="kpi"><span>Margine stimato</span><b>${eur(r2(marg))}</b></div></div>
  <div class="tblwrap"><table class="tbl"><thead><tr><th>Sposi</th><th>Data</th><th>Location</th><th class="n">Invitati</th><th class="n">Totale</th><th class="n">Incassato</th><th class="n">Residuo</th><th class="n">Margine</th><th>Prossima scadenza</th></tr></thead>
  <tbody>${rows||'<tr><td colspan="9" class="empty">Nessun evento confermato. Apri un preventivo e premi “Conferma evento”.</td></tr>'}</tbody></table></div>
  <p class="note">Il margine è calcolato su imponibile meno costi inseriti nell’evento; compare solo se hai inserito almeno un costo.</p>`;
}

function updEco(){
  if(view!=='detail'||sub!=='eco')return;
  const rec=cur();if(!rec)return;const c=payCalc(rec);
  const set=(id,v)=>{const el=$('#'+id);if(el)el.textContent=v};
  set('ecSub',eur(c.T.sub));set('ecSc','− '+eur(c.T.sc));set('ecImp',eur(c.T.imp));set('ecIva',eur(c.T.iva));set('ecTot',eur(c.T.tot));
  set('ecInc',eur(c.inc));set('ecRes',eur(c.res));set('ecCosti',eur(c.costi));set('ecMarg',eur(c.marg));
  set('ecMargP',(c.T.imp?c.margP.toFixed(1).replace('.',','):'0')+'%');
  const w=$('#ecWarn');
  if(w)w.textContent=(!c.hasSaldo&&c.diff!==0)?`Il piano copre ${eur(c.sched)} su ${eur(c.T.tot)}: ${c.diff>0?'mancano':'eccedono'} ${eur(Math.abs(c.diff))}.`:(c.hasSaldo&&c.rest<0?`Le rate fisse superano il totale di ${eur(-c.rest)}.`:'');
  document.querySelectorAll('[data-p]').forEach((row,i)=>{if(rec.pag[i]&&rec.pag[i].saldo){const inp=row.querySelector('[data-saldoinp]');if(inp)inp.value=c.amt[i]}});
}
function detailHTML(){

    :'<button class="btn" data-act="confirm">✓ Conferma evento</button><button class="btn ghost sm" data-act="lost">Segna come perso</button>';
  const head=`<div class="dhead noprint"><button class="btn ghost sm" data-view="${conf?'eventi':'preventivi'}">← ${conf?'Eventi confermati':'Preventivi'}</button>
    <div style="flex:1;min-width:200px"><h2 style="font-size:28px">${esc(m.sposi||'Senza nome')}</h2><div class="note" style="margin:0">${esc([m.dataEvento?fmtDate(m.dataEvento):'',m.location].filter(Boolean).join(' · '))}</div></div>

/* ───────────── NAVIGAZIONE ───────────── */
function renderMainNav(){
  const nP=DB.records.filter(r=>r.stato==='preventivo').length,nE=DB.records.filter(r=>r.stato==='confermato').length;
  const act=view==='detail'?((cur()&&cur().stato==='confermato')?'eventi':'preventivi'):view;

function setView(v){view=v;S=DB.draft;if(v==='prev')step=0;render();window.scrollTo(0,0)}
function openRecord(id,sb){const r=DB.records.find(x=>x.id===id);if(!r)return;openId=id;view='detail';S=r.S;sub=sb||(r.stato==='confermato'?'eco':'dati');render();window.scrollTo(0,0)}

function render(){

function refresh(){

  $('#sbZones').innerHTML=S.zones.filter(z=>zoneSub(z)>0).map(z=>`<div class="row mu"><span>${esc(z.name)}</span><span>${eur(zoneSub(z))}</span></div>`).join('')||'<div class="note">Nessuna voce selezionata</div>';
  $('#sbCapPct').textContent=(+S.extra.caparra||0)+'%';
  $('#sbCap').textContent=eur(T.cap);
  $('#sbSaldo').textContent=eur(T.saldo);
  document.querySelectorAll('[data-zone]').forEach(c=>{const z=S.zones[+c.dataset.zone];c.querySelector('[data-zsub]').textContent=eur(zoneSub(z));
    const b=c.querySelector('[data-zcount]');b.textContent=z.items.length;b.classList.toggle('z',!z.items.length)});
  $('#mbTot').textContent=eur(T.tot);
  const el=$('#invTot');if(el){const n=(+S.meta.adulti||0)+(+S.meta.bimbi||0);
    el.innerHTML=n?`Totale invitati: <b>${n}</b> · tavoli consigliati (10 a tavolo): <b>${Math.ceil(n/10)}</b>`:'Inserisci gli invitati: i tavoli vengono stimati a 10 per tavolo.'}
  updEco();
  persist();
}

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.search!==undefined){UI.q=t.value;$('#tblBody').innerHTML=rowsPrev();return}

    if(f==='pagato'){p.pagato=t.checked;if(t.checked&&!p.dataPag)p.dataPag=todayISO();render();return}
    if(f==='saldo'){rec.pag.forEach(x=>x.saldo=false);p.saldo=t.checked;render();return}
    p[f]=t.value;refresh();return;
  }
  if(t.dataset.cf){const rec=cur(),x=rec.costi[+t.closest('[data-c]').dataset.c];x[t.dataset.cf]=t.value;refresh();return}
  if(t.dataset.k){

    const row=t.closest('.irow');const it=S.zones[+row.dataset.z].items[+row.dataset.i];

  else if(act==='add'){const zi=+a.dataset.z,z=S.zones[zi];z.items.push({k:++uid,d:'',q:1,p:0,inc:false,pt:false,custom:true,on:true,_new:1});UI.open[z.id]=true;render();

  r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.records))throw 0;
    if(!confirm('Sostituire tutti i dati attuali con quelli del file?'))return;
    DB={records:o.records,draft:o.draft||freshState(false)};recalcUid();setView('preventivi');toast('Dati importati')}catch(x){alert('File non valido.')}};
  r.readAsText(f);ev.target.value='';
};

loadDB();
S=DB.draft;
render();

</script>
</body>
